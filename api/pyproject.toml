[project]
name = "learn-anything-api"
version = "0.1.0"
description = "AI Engineering Academy — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",  # syllabus file uploads
  "anthropic>=2.8,<3",
  "pypdf>=4.2",
  "defusedxml>=0.7",          # safe parsing of generated SVG diagrams and arXiv feeds
]

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
